<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020806">
<title>RoomBoom</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  html, body, * {
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
}
input, textarea, [contenteditable="true"] {
  -webkit-user-select: text;
  -webkit-touch-callout: default;
  user-select: text;
}
:root{--bg:#020806;--g:#00ff9c;--c:#00e5ff;--r:#ff2e63;--o:#ffb020;--tx:#c8ffe6;--dim:#4f8f76}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:14px ui-monospace,Menlo,Consolas,monospace;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
#splash{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--g);font-size:26px;letter-spacing:6px;text-shadow:0 0 14px var(--g);animation:bl2 1.2s infinite}
@keyframes bl2{50%{opacity:.5}}
.view.on{animation:vin .22s ease-out}@keyframes vin{from{opacity:0;transform:translateY(8px)}}
#msgs,.list{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px);animation:fl 6s infinite}
@keyframes fl{0%,96%,100%{opacity:.7}97%{opacity:1}98%{opacity:.4}}
#rain{position:fixed;inset:0;width:100%;height:100%;opacity:.3;z-index:0}
button,input{font:inherit;color:var(--g);background:rgba(0,20,12,.88);border:1px solid var(--g);border-radius:3px;padding:10px 12px}
button{cursor:pointer;text-shadow:0 0 6px var(--g);box-shadow:inset 0 0 8px #00ff9c33}
button:active{background:#00ff9c44}
input{width:100%;outline:none;caret-color:var(--g)}input:focus{box-shadow:0 0 12px #00ff9c88}
.glow{color:var(--g);text-shadow:0 0 10px var(--g)}
.cur:after{content:"█";animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
/* login */
#login{position:relative;z-index:1;display:none;flex-direction:column;gap:10px;justify-content:center;height:100%;padding:26px;max-width:420px;margin:auto}
.gl{position:relative;font-size:34px;letter-spacing:6px;text-align:center;color:var(--g);text-shadow:0 0 14px var(--g);margin-bottom:6px}
.gl:before,.gl:after{content:attr(data-t);position:absolute;left:0;right:0;top:0}
.gl:before{color:var(--r);clip-path:inset(0 0 55% 0);animation:g1 2.6s infinite steps(1)}
.gl:after{color:var(--c);clip-path:inset(55% 0 0 0);animation:g2 2.6s infinite steps(1)}
@keyframes g1{0%,90%,100%{transform:none}92%{transform:translate(-4px,1px)}96%{transform:translate(4px,-1px)}}
@keyframes g2{0%,88%,100%{transform:none}90%{transform:translate(4px,1px)}95%{transform:translate(-4px,-1px)}}
#boot{color:var(--dim);font-size:12px;min-height:54px}
#login label{font-size:12px;color:var(--dim)}
#err{color:var(--r);font-size:13px;min-height:18px;text-shadow:0 0 8px var(--r)}
/* app */
#app{position:relative;z-index:1;display:none;height:100%;flex-direction:column;animation:on .6s}
@keyframes on{from{opacity:0;filter:brightness(4) blur(4px)}}
header{display:flex;align-items:center;gap:6px;padding:10px;border-bottom:1px solid #00ff9c55;background:rgba(2,8,6,.9)}
header h2{margin:0;flex:1;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.view{display:none;flex-direction:column;flex:1;min-height:0}.view.on{display:flex}
.list{flex:1;overflow:auto;padding:10px}
.item{padding:14px;border:1px solid #00ff9c33;border-left:3px solid var(--g);margin-bottom:8px;background:rgba(2,16,10,.9);animation:opin .35s both}
.item small{color:var(--dim)}
/* operatives */
.op{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #00ff9c33;border-left:3px solid var(--c);margin-bottom:8px;background:rgba(2,16,10,.92);opacity:0;animation:opin .45s forwards}
@keyframes opin{from{opacity:0;transform:translateX(-40px) skewX(-8deg);filter:hue-rotate(120deg)}to{opacity:1;transform:none}}
.dot{width:11px;height:11px;border-radius:50%;background:#2a3a34}.dot.on{background:var(--g);box-shadow:0 0 10px var(--g);animation:pl 1.6s infinite}
@keyframes pl{50%{box-shadow:0 0 2px var(--g)}}
.st{font-size:11px;color:var(--dim)}.st.on{color:var(--g)}
/* chat */
#msgs{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.m{max-width:84%;align-self:flex-start;padding:7px 10px;border:1px solid #00ff9c44;border-left:3px solid var(--g);background:rgba(2,16,10,.9);animation:in .3s ease-out;word-break:break-word}
@keyframes in{from{opacity:0;transform:translateX(-16px) skewX(-8deg);filter:hue-rotate(90deg) brightness(2)}}
.m.me{align-self:flex-end;border-color:#ff2e6355;border-left-width:1px;border-right:3px solid var(--r);animation-name:in2}
@keyframes in2{from{opacity:0;transform:translateX(16px) skewX(8deg);filter:hue-rotate(-90deg) brightness(2)}}
.m .n{font-size:11px;color:var(--c)}.m.me .n{color:var(--r)}
.m .q{border-left:2px solid var(--c);padding:1px 6px;margin:3px 0;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .t{font-size:10px;color:var(--dim)}
.m.boom{border-color:var(--o);border-style:dashed}
.m.gone{opacity:.45;font-style:italic}
.rx{display:flex;gap:4px;flex-wrap:wrap}.rx span{border:1px solid #00ff9c55;border-radius:10px;padding:1px 7px;margin-top:4px;font-size:12px}.rx .mine{background:#00ff9c33}
#ctx{display:none;align-items:center;gap:8px;padding:6px 10px;border-top:1px solid var(--c);color:var(--c);font-size:12px;background:rgba(2,16,10,.95)}
#ctx span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{display:flex;gap:6px;padding:8px;border-top:1px solid #00ff9c55;background:rgba(2,8,6,.95)}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#04140d;border-top:1px solid var(--g);padding:12px;display:none;flex-direction:column;gap:8px;animation:up .2s;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
@keyframes up{from{transform:translateY(100%)}}
#wrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}#msgs{min-height:0}
.av{display:inline-block;vertical-align:middle;border:1px solid;border-radius:4px;background:#020806;padding:2px;flex:none}
.row{display:flex;align-items:center;gap:12px}.mid{flex:1;min-width:0}
.rt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pv{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.unr .pv{color:var(--tx)}
.bdg{background:var(--g);color:#020806;border-radius:10px;padding:0 7px;font-size:11px;font-weight:bold;box-shadow:0 0 10px var(--g)}
.tm{color:var(--dim);font-size:11px}
.m .n{display:flex;align-items:center;gap:5px}
.sep{align-self:center;color:var(--dim);font-size:11px;letter-spacing:2px;margin:6px 0}
.tk{font-size:10px;color:var(--dim)}.tk.seen{color:var(--c);text-shadow:0 0 6px var(--c)}
#typing{display:none;padding:2px 12px;font-size:12px;color:var(--c)}#typing.on{display:block}
#typing.on:after{content:"...";display:inline-block;width:0;overflow:hidden;vertical-align:bottom;animation:dots 1.2s steps(4) infinite}
@keyframes dots{to{width:1.6em}}
#tobot{display:none;position:absolute;right:12px;bottom:10px;z-index:5;border-radius:20px;background:rgba(2,16,10,.95);box-shadow:0 0 12px #00ff9c66}
#net{display:none;text-align:center;font-size:11px;padding:3px}
#net.bad{display:block;color:var(--o);background:#2a1a00;animation:bl2 1s infinite}
#net.ok{display:block;color:var(--g);background:#032015}
.modebar{display:flex;gap:8px;padding:10px}
.modebar button{flex:1;opacity:.55}.modebar button.active{opacity:1;background:#00ff9c22;box-shadow:0 0 12px #00ff9c88}
.op.sel{border-color:var(--g);background:rgba(0,255,156,.16)}
#grpBar{display:none}
#micBtn.rec{background:#ff2e6344;border-color:var(--r);color:var(--r);animation:pl 1s infinite}
.m img{max-width:220px;max-height:260px;border:1px solid #00ff9c55;border-radius:4px;display:block;cursor:pointer}
.m audio{max-width:230px;height:34px}
.m .cap{margin-top:4px}
#toasts{position:fixed;top:calc(10px + env(safe-area-inset-top));left:0;right:0;z-index:70;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{pointer-events:auto;max-width:90%;padding:9px 14px;border:1px solid var(--g);background:rgba(2,20,12,.95);color:var(--g);font-size:13px;box-shadow:0 0 14px #00ff9c55;border-radius:3px;animation:tin .25s,tout .25s 2.6s forwards}
.toast.err{border-color:var(--r);color:var(--r);box-shadow:0 0 14px #ff2e6355}
@keyframes tin{from{opacity:0;transform:translateY(-14px)}}
@keyframes tout{to{opacity:0;transform:translateY(-14px)}}
#modalWrap{position:fixed;inset:0;z-index:71;display:none;align-items:center;justify-content:center;background:rgba(0,10,6,.75)}
#modalWrap.on{display:flex}
#modalBox{width:min(320px,86vw);background:#04140d;border:1px solid var(--g);box-shadow:0 0 24px #00ff9c55;padding:16px;display:flex;flex-direction:column;gap:10px;animation:up .18s}
#modalBox .mt{color:var(--g);text-shadow:0 0 8px var(--g);font-size:13px}
#modalBox .mb{display:flex;gap:8px;justify-content:flex-end}
.spin{width:14px;height:14px;border:2px solid #00ff9c33;border-top-color:var(--g);border-radius:50%;display:inline-block;animation:spin .6s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.spin-ico{display:inline-block;animation:spin .8s linear infinite}
.pending .x img{opacity:.55}
.uploading{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:6px;margin-top:4px}
#titleWrap{flex:1;min-width:0;overflow:hidden}
#titleWrap h2{margin:0}
#substatus{display:block;color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#substatus.on{color:var(--g)}
.danger{border-color:var(--r) !important;color:var(--r) !important}
.icon-btn{width:38px;height:38px;min-width:38px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:17px;line-height:1;flex:none}
.icon-btn:active{transform:scale(.86)}
.bar .icon-btn{width:40px;height:40px;font-size:18px}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<div id="splash">ROOMBOOM</div>
<div id="toasts"></div>
<div id="modalWrap"><div id="modalBox"></div></div>

<div id="login">
  <div class="gl" data-t="ROOMBOOM">ROOMBOOM</div>
  <div id="boot"></div>
  <label>root@roomboom:~$ username / email</label>
  <input id="uid" autocapitalize="none" autocomplete="username">
  <label>root@roomboom:~$ passkey</label>
  <input id="pw" type="password" autocomplete="current-password">
  <button id="go">[ ESTABLISH LINK ]</button>
  <div id="err"></div>
</div>

<div id="app">
  <header>
    <button id="back" class="icon-btn" style="display:none">◀</button>
    <div id="titleWrap"><h2 id="title" class="glow"></h2><small id="substatus"></small></div>
    <button id="refresh" class="icon-btn" style="display:none">⟳</button>
    <button id="plus" class="icon-btn">＋</button>
    <button id="adm" class="icon-btn" style="display:none">🛡</button>
    <button id="settings" class="icon-btn">⚙</button>
  </header>
  <div id="net"></div>
  <div class="view on" id="v-rooms"><div class="list" id="rooms"></div></div>
  <div class="view" id="v-ops">
    <div class="modebar"><button id="modeDm" class="active">◉ DIRECT</button><button id="modeGrp">&#35; GROUP</button></div>
    <div class="list" id="ops"></div>
    <div class="bar" id="grpBar"><input id="grpName" placeholder="group name"><button id="grpGo">CREATE</button></div>
  </div>
  <div class="view" id="v-chat">
    <div id="wrap"><div id="msgs"></div><button id="tobot"></button></div>
    <div id="typing"></div>
    <div id="ctx"></div>
    <div class="bar">
      <button id="boomBtn" class="icon-btn">💣</button>
      <button id="attBtn" class="icon-btn">📎</button>
      <button id="micBtn" class="icon-btn">🎙</button>
      <input id="txt" placeholder="> transmit..." autocomplete="off">
      <button id="send" class="icon-btn">➤</button>
    </div>
    <input id="fileIn" type="file" accept="image/*" style="display:none">
    <input id="fileIn2" type="file" accept="audio/*" style="display:none">
  </div>
  <div class="view" id="v-settings">
    <div class="list">
      <div class="item">
        <b class="glow">&gt; IDENTITY</b><br><br>
        <input id="setCallsign" placeholder="callsign">
        <br><br><button id="setSaveName">SAVE CALLSIGN</button>
      </div>
      <div class="item">
        <b class="glow">&gt; THEME</b><br><br>
        <div class="modebar"><button data-th="green">GREEN</button><button data-th="blue">BLUE</button></div>
        <div class="modebar"><button data-th="red">RED</button><button data-th="amber">AMBER</button></div>
      </div>
      <div class="item" id="setAdminLink" style="display:none">
        <b class="glow">&gt; COMMAND</b><br><br>
        <button id="goAdmin">OPEN ADMIN PANEL</button>
      </div>
      <div class="item"><button id="out" style="width:100%">⏻ LOGOUT</button></div>
    </div>
  </div>
  <div class="view" id="v-admin">
    <div class="list">
      <div class="item">
        <b class="glow">&gt; NEW OPERATIVE</b><br><br>
        <input id="nu" placeholder="username (a-z, 0-9, _)" autocapitalize="none"><br><br>
        <input id="nc" placeholder="callsign (display name)"><br><br>
        <input id="np" placeholder="password (min 6)"><br><br>
        <button id="mk">CREATE USER</button>
        <div id="aerr" style="margin-top:8px;font-size:13px"></div>
      </div>
      <div id="ulist"></div>
    </div>
  </div>
  <div id="sheet"></div>
</div>

<script>
const SB_URL="https://qgvpsqxcnwcbvieodnna.supabase.co";
const SB_KEY="sb_publishable_n_do5KpNG1NH4uWiMf9kIQ_fWu6tO-N";
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
let me,profiles={},room=null,chan=null,boomSecs=0,msgs=new Map(),rx={},replyTo=null,editing=null;
let roomType="dm",otherRead=null,lastDay="",newCount=0,curView="rooms",lch=null,typingT={},lastTypeSent=0,loading=false,roomsShown=false;
let opsMode="dm",selMembers=new Set(),opsList=[],mediaRecorder=null,recChunks=[];const urlCache=new Map();
let otherId=null,subTimer=null;
const T=x=>+new Date(x);
const DEL="::deleted::";

/* ---------- effects ---------- */
(()=>{const c=$("rain"),x=c.getContext("2d");let w,h,y;
 const set=()=>{w=c.width=innerWidth;h=c.height=innerHeight;y=Array(Math.floor(w/16)).fill(0).map(()=>Math.random()*h/16)};
 set();addEventListener("resize",set);const ch="01ｱｲｳｴｵｶｷｸｹｺ<>/{}#$%";
 setInterval(()=>{if(document.hidden||c.style.display==="none")return;x.fillStyle="rgba(2,8,6,.12)";x.fillRect(0,0,w,h);x.fillStyle="#00ff9c";x.font="14px monospace";
  y.forEach((v,i)=>{x.fillText(ch[Math.random()*ch.length|0],i*16,v*16);y[i]=v*16>h&&Math.random()>.975?0:v+1})},70)})();
function type(el,t,sp,cb){el.textContent="";let i=0;const iv=setInterval(()=>{el.textContent=t.slice(0,++i);if(i>=t.length){clearInterval(iv);cb&&cb()}},sp||28)}
const setTitle=t=>type($("title"),t,25);
async function bootLog(){for(const l of ["> booting roomboom kernel...","> encrypting uplink [AES-256]...","> awaiting operator credentials"]){
 const d=document.createElement("div");$("boot").appendChild(d);await new Promise(r=>type(d,l,22,r))}
 $("boot").lastChild.classList.add("cur")}
function showLogin(){$("splash").style.display="none";$("login").style.display="flex";bootLog()}

/* ---------- notifications ---------- */
function toast(msg,type){
 const t=document.createElement("div");t.className="toast"+(type==="err"?" err":"");t.textContent=(type==="err"?"⚠ ":"> ")+msg;
 $("toasts").appendChild(t);setTimeout(()=>t.remove(),3000);
}
function modal({title,placeholder,value="",okText="OK",onlyOk=false}){
 return new Promise(res=>{
  const w=$("modalWrap"),b=$("modalBox");b.innerHTML="";
  const t=document.createElement("div");t.className="mt";t.textContent=title;b.appendChild(t);
  let inp=null;
  if(placeholder!==undefined){inp=document.createElement("input");inp.placeholder=placeholder;inp.value=value;b.appendChild(inp)}
  const row=document.createElement("div");row.className="mb";
  const close=v=>{w.classList.remove("on");res(v)};
  if(!onlyOk){const c=document.createElement("button");c.textContent="CANCEL";c.onclick=()=>close(null);row.appendChild(c)}
  const ok=document.createElement("button");ok.textContent=okText;ok.onclick=()=>close(inp?inp.value:true);row.appendChild(ok);
  b.appendChild(row);w.classList.add("on");if(inp){inp.focus();inp.onkeydown=e=>{if(e.key==="Enter")close(inp.value)}}
 });
}
async function withBusy(btn,fn){
 const orig=btn.innerHTML;btn.disabled=true;btn.style.opacity=".6";btn.innerHTML='<span class="spin"></span>';
 try{return await fn()}finally{btn.disabled=false;btn.style.opacity="";btn.innerHTML=orig}
}
/* ---------- themes ---------- */
const THEMES={green:{g:"#00ff9c",c:"#00e5ff",r:"#ff2e63"},blue:{g:"#00d4ff",c:"#7dfcff",r:"#ff5c5c"},red:{g:"#ff2e4e",c:"#ff8a3d",r:"#00ff9c"},amber:{g:"#ffb020",c:"#ffe083",r:"#ff2e63"}};
function setTheme(name){
 const t=THEMES[name];if(!t){toast("themes: green, blue, red, amber","err");return}
 const s=document.documentElement.style;s.setProperty("--g",t.g);s.setProperty("--c",t.c);s.setProperty("--r",t.r);
 try{localStorage.setItem("rb_theme",name)}catch(e){}
 toast("theme: "+name);
}
(()=>{try{const t=localStorage.getItem("rb_theme");if(t&&THEMES[t]){const s=document.documentElement.style,x=THEMES[t];s.setProperty("--g",x.g);s.setProperty("--c",x.c);s.setProperty("--r",x.r)}}catch(e){}})();

/* ---------- auth ---------- */
$("go").onclick=()=>withBusy($("go"),async()=>{
 $("err").textContent="";let id=$("uid").value.trim().toLowerCase();if(!id.includes("@"))id+="@roomboom.app";
 const {error}=await sb.auth.signInWithPassword({email:id,password:$("pw").value});
 if(error)$("err").textContent="> ACCESS DENIED ("+error.message+")";else start()});
$("pw").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
$("out").onclick=async()=>{try{localStorage.removeItem("rb_me")}catch(e){}await sb.auth.signOut();location.reload()};
let started=false;
function enter(){started=true;$("splash").style.display="none";$("login").style.display="none";$("app").style.display="flex";show("rooms");loadRooms();ping();setInterval(ping,60000);startGlobal()}
async function start(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session){showLogin();return}
 let c=null;try{c=JSON.parse(localStorage.getItem("rb_me"))}catch(e){}
 if(c&&c.id===session.user.id&&!started){me=c;profiles[me.id]=me;enter()}
 const ok=await fetchProfiles();const p=profiles[session.user.id];
 if(ok&&(!p||p.is_banned)){try{localStorage.removeItem("rb_me")}catch(e){}await sb.auth.signOut();location.reload();return}
 if(p){me=p;try{localStorage.setItem("rb_me",JSON.stringify(p))}catch(e){}}
 if(!started){if(!me){showLogin();return}enter()}
}
const ping=()=>sb.from("profiles").update({last_seen:new Date().toISOString()}).eq("id",me.id);
async function fetchProfiles(){const {data}=await sb.from("profiles").select("*");(data||[]).forEach(p=>profiles[p.id]=p);return !!data}

/* ---------- navigation ---------- */
function show(v){
 curView=v;$("rain").style.display=v==="chat"?"none":"";
 ["rooms","ops","chat","admin","settings"].forEach(x=>$("v-"+x).classList.toggle("on",x===v));
 $("back").style.display=v==="rooms"?"none":"";$("plus").style.display=v==="rooms"?"":"none";
 $("refresh").style.display=v==="rooms"?"":"none";
 $("adm").style.display=(v==="rooms"&&me.role==="admin")?"":"none";
 if(v==="rooms")setTitle("ROOMBOOM");
 if(v!=="chat"){clearInterval(subTimer);$("substatus").textContent=""}
 if(v!=="chat"&&chan){sb.removeChannel(chan);chan=null;room=null}
}
let viewStack=["rooms"];
function afterNav(v){if(v==="rooms")mrp.then(loadRooms);if(v==="ops")setTitle("> OPERATIVES");if(v==="admin")setTitle("> COMMAND");if(v==="settings")setTitle("> SETTINGS")}
function go(v){viewStack.push(v);show(v);afterNav(v)}
function backNav(){
 if(room)markRead(true);

function av(name,sz){
 const h=[...(name||"?")].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7),hue=[150,180,320,45,200][h%5];let r="";
 for(let y=0;y<5;y++)for(let x=0;x<3;x++)if((h>>(y*3+x+2))&1){r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;if(x<2)r+=`<rect x="${4-x}" y="${y}" width="1" height="1"/>`}
 if(!r)r='<rect x="2" y="1" width="1" height="3"/>';
 const d=document.createElement("span");d.className="av";
 d.style.cssText=`width:${sz}px;height:${sz}px;border-color:hsl(${hue} 100% 55%);box-shadow:0 0 8px hsl(${hue} 100% 55% / .5);color:hsl(${hue} 100% 60%)`;
 d.innerHTML=`<svg viewBox="-0.5 -0.5 6 6" fill="currentColor" width="100%" height="100%">${r}</svg>`;return d}
function fmt(t){const d=new Date(t),n=new Date();return d.toDateString()===n.toDateString()?d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):d.toLocaleDateString([],{day:"2-digit",month:"short"})}
function dayName(t){const d=new Date(t),n=new Date(),y=new Date(n-864e5);return d.toDateString()===n.toDateString()?"TODAY":d.toDateString()===y.toDateString()?"YESTERDAY":d.toLocaleDateString([],{day:"2-digit",month:"short",year:"numeric"}).toUpperCase()}

async function loadRooms(){
 const l=$("rooms");if(!roomsShown){l.innerHTML="";l.appendChild(loaderRow())}
 await fetchProfiles();
 const [{data:ms},{data:lm}]=await Promise.all([
  sb.from("room_members").select("room_id,user_id,last_read_at,rooms(id,type,name)"),
  sb.from("messages").select("room_id,sender_id,body,created_at,expires_at,media_type").order("created_at",{ascending:false}).limit(300)]);
 l.innerHTML="";const by={};(ms||[]).forEach(m=>(by[m.room_id]??=[]).push(m));
 const last={},unread={},now=Date.now(),anim=!roomsShown;roomsShown=true;
 (lm||[]).forEach(m=>{if(m.expires_at&&T(m.expires_at)<now)return;
  last[m.room_id]??=m;const mine=by[m.room_id]?.find(x=>x.user_id===me.id);
  if(m.sender_id!==me.id&&mine&&T(m.created_at)>T(mine.last_read_at)&&m.body!==DEL)unread[m.room_id]=(unread[m.room_id]||0)+1});
 const rows=Object.values(by).map(arr=>{const r=arr[0].rooms,o=arr.find(m=>m.user_id!==me.id);
  return{r,name:r.type==="dm"?(profiles[o?.user_id]?.callsign||"?"):(r.name||"room"),lm:last[r.id],u:unread[r.id]||0}});
 rows.sort((a,b)=>(b.lm?T(b.lm.created_at):0)-(a.lm?T(a.lm.created_at):0));
 rows.forEach((x,i)=>{
  const d=document.createElement("div");d.className="item row";
  if(anim)d.style.animationDelay=i*.06+"s";else d.style.animation="none";
  d.innerHTML='<div class="mid"><div class="rt"><b class="glow"></b><small class="tm"></small></div><div class="rt"><small class="pv"></small></div></div>';
  d.prepend(av(x.name,42));
  d.querySelector("b").textContent=(x.r.type==="dm"?"":"# ")+x.name;
  const m=x.lm;
  d.querySelector(".pv").textContent=m?(m.sender_id===me.id?"you: ":"")+(m.body===DEL?"☠ purged":m.expires_at?"💣 boom message":m.media_type==="image"?"📷 photo":m.media_type==="voice"?"🎙 voice note":m.body||""):"> no transmissions yet";
  d.querySelector(".tm").textContent=m?fmt(m.created_at):"";
  if(x.u){const b=document.createElement("span");b.className="bdg";b.textContent=x.u>99?"99+":x.u;d.querySelector(".rt:last-child").appendChild(b);d.classList.add("unr")}
  let lpT=null,supp=false;
  d.addEventListener("touchstart",()=>{supp=false;lpT=setTimeout(()=>{supp=true;openChatMenu(x.r.id,x.name)},500)});
  d.addEventListener("touchend",()=>clearTimeout(lpT));
  d.addEventListener("touchmove",()=>clearTimeout(lpT));
  d.addEventListener("contextmenu",e=>{e.preventDefault();openChatMenu(x.r.id,x.name)});
  d.onclick=()=>{if(supp){supp=false;return}openRoom(x.r.id,x.name,x.r.type)};l.appendChild(d)});
 if(!rows.length)l.innerHTML='<div class="item"><small>> no active links. tap ＋ to scan the network.</small></div>';
}

async function openRoom(id,name,type){
 room=id;roomType=type||"dm";otherId=null;msgs.clear();rx={};replyTo=editing=null;updBars();
 lastDay="";newCount=0;otherRead=null;$("tobot").style.display="none";$("typing").classList.remove("on");
 go("chat");setTitle((roomType==="group"?"# ":"◉ ")+name);$("substatus").textContent="";
 $("msgs").innerHTML="";$("msgs").appendChild(loaderRow());
 const [{data},{data:mm}]=await Promise.all([
  sb.from("messages").select("*").eq("room_id",id).order("created_at",{ascending:false}).limit(60),
  sb.from("room_members").select("user_id,last_read_at").eq("room_id",id)]);
 $("msgs").innerHTML="";
 (data||[]).reverse().forEach(m=>msgs.set(m.id,m));
 setOther(mm);
 clearInterval(subTimer);
 if(roomType==="dm"){const o=(mm||[]).find(x=>x.user_id!==me.id);otherId=o?o.user_id:null;updSub();subTimer=setInterval(updSub,20000)}
 await loadRx();loading=true;msgs.forEach(m=>draw(m));loading=false;$("msgs").scrollTop=1e9;
 markRead();
 chan=sb.channel("m-"+id)
  .on("postgres_changes",{event:"*",schema:"public",table:"messages",filter:"room_id=eq."+id},p=>{
    if(!p.new||!p.new.id)return;msgs.set(p.new.id,p.new);draw(p.new);
    if(p.eventType==="INSERT"&&p.new.sender_id!==me.id&&!document.hidden)markRead()})
  .on("postgres_changes",{event:"UPDATE",schema:"public",table:"room_members",filter:"room_id=eq."+id},p=>{
    if(p.new.user_id!==me.id){otherRead=Math.max(otherRead||0,T(p.new.last_read_at));paintTicks()}})
  .on("postgres_changes",{event:"*",schema:"public",table:"reactions"},()=>loadRx().then(()=>msgs.forEach(m=>paintRx(m.id))))
  .on("broadcast",{event:"typing"},p=>typingIn(p.payload.uid))
  .subscribe();
}
function setOther(mm){(mm||[]).filter(x=>x.user_id!==me.id).forEach(x=>{otherRead=Math.max(otherRead||0,T(x.last_read_at))});paintTicks()}
function updSub(){
 if(!otherId)return;const p=profiles[otherId];if(!p)return;
 const on=Date.now()-new Date(p.last_seen)<120000,e=$("substatus");
 e.textContent=on?"● online":"last seen "+fmt(p.last_seen);e.classList.toggle("on",on);
}
function typingIn(uid){const e=$("typing");e.textContent="> "+(profiles[uid]?.callsign||"someone")+" is typing";e.classList.add("on");
 clearTimeout(typingT.t);typingT.t=setTimeout(()=>e.classList.remove("on"),3000)}
function showTobot(){const b=$("tobot");b.style.display="block";b.textContent="↓"+(newCount?" "+newCount+" NEW":"")}
function paintTick(m,d){const t=d.querySelector(".tk");if(!t)return;
 if(m.sender_id!==me.id||m.body===DEL){t.textContent="";return}
 const seen=roomType==="dm"&&otherRead&&otherRead>=T(m.created_at);
 t.textContent=seen?"✓✓":"✓";t.className="tk"+(seen?" seen":"")}
function paintTicks(){msgs.forEach(m=>{const d=$("m-"+m.id);if(d)paintTick(m,d)})}
async function loadRx(){
 rx={};const ids=[...msgs.keys()];if(!ids.length)return;
 const {data}=await sb.from("reactions").select("*").in("message_id",ids);
 (data||[]).forEach(r=>((rx[r.message_id]??={})[r.emoji]??=[]).push(r.user_id));
}

function draw(m){
 const pending=!!m._pending;
 const left=m.expires_at?T(m.expires_at)-Date.now():null;
 if(!pending&&left!==null&&left<=0){$("m-"+m.id)?.remove();return}
 const gone=m.body===DEL,box=$("msgs");let d=$("m-"+m.id);const isNew=!d;let stick=false;
 if(isNew){
  stick=loading||m.sender_id===me.id||box.scrollHeight-box.scrollTop-box.clientHeight<160;
  if(!pending){
   const day=new Date(m.created_at).toDateString();
   if(day!==lastDay){lastDay=day;const sp=document.createElement("div");sp.className="sep";sp.textContent="── "+dayName(m.created_at)+" ──";box.appendChild(sp)}
  }
  d=document.createElement("div");d.id="m-"+m.id;box.appendChild(d)}
 d.className="m"+(m.sender_id===me.id?" me":"")+(m.expires_at?" boom":"")+(gone?" gone":"")+(pending?" pending":"");
 d.innerHTML='<div class="n"></div><div class="q"></div><div class="x"></div><div class="rx"></div><span class="t"></span> <span class="tk"></span>';
 const nm=profiles[m.sender_id]?.callsign||"???",n=d.querySelector(".n");n.textContent=nm+" >";n.prepend(av(nm,18));
 const q=d.querySelector(".q");
 if(!pending&&m.reply_to){const r=msgs.get(m.reply_to);q.textContent="↩ "+(r?(profiles[r.sender_id]?.callsign||"?")+": "+(r.body===DEL?"[purged]":r.body):"…")}
 else q.remove();
 const xEl=d.querySelector(".x");
 if(gone){xEl.textContent="☠ message purged"}
 else if(pending){
  xEl.textContent="";
  if(m.media_type==="image"&&m._local){const img=document.createElement("img");img.src=m._local;xEl.appendChild(img)}
  const up=document.createElement("div");up.className="uploading";up.innerHTML='<span class="spin"></span> uploading...';xEl.appendChild(up);
 }
 else if(m.media_path){
  xEl.textContent="";
  if(m.media_type==="image"){
   const img=document.createElement("img");img.onclick=ev=>{ev.stopPropagation();mediaUrl(m.media_path).then(u=>u&&openLightbox(u))};
   xEl.appendChild(img);mediaUrl(m.media_path).then(u=>{if(u)img.src=u});
  }else{
   const au=document.createElement("audio");au.controls=true;au.onclick=ev=>ev.stopPropagation();
   xEl.appendChild(au);mediaUrl(m.media_path).then(u=>{if(u)au.src=u});
  }
  if(m.body){const c=document.createElement("div");c.className="cap";c.textContent=m.body;xEl.appendChild(c)}
 } else xEl.textContent=m.body;
 d.querySelector(".t").textContent=pending?"":(new Date(m.created_at).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+(m.edited_at&&!gone?" · edited":"")+(m.expires_at?" 💣":""));
 d.onclick=()=>{if(!gone&&!pending)openSheet(m.id)};
 if(!pending){paintRx(m.id);paintTick(m,d)}
 if(isNew){
  if(m.sender_id!==me.id)$("typing").classList.remove("on");
  if(stick)box.scrollTop=1e9;else{newCount++;showTobot()}
  if(!pending&&left!==null)setTimeout(()=>boom(d),left)}
}
function boom(d){d.style.transition="all .45s";d.style.transform="scale(1.3) skewX(12deg)";d.style.filter="hue-rotate(180deg) brightness(3)";d.style.opacity="0";setTimeout(()=>d.remove(),450)}
function paintRx(id){
 const el=$("m-"+id)?.querySelector(".rx");if(!el)return;el.innerHTML="";
 Object.entries(rx[id]||{}).forEach(([e,u])=>{const s=document.createElement("span");s.textContent=e+" "+u.length;
  if(u.includes(me.id))s.className="mine";s.onclick=ev=>{ev.stopPropagation();react(id,e)};el.appendChild(s)});
}
async function react(id,e){
 const has=(rx[id]?.[e]||[]).includes(me.id);
 if(has){await sb.from("reactions").delete().match({message_id:id,user_id:me.id,emoji:e});
  rx[id][e]=rx[id][e].filter(x=>x!==me.id);if(!rx[id][e].length)delete rx[id][e]}
 else{await sb.from("reactions").insert({message_id:id,user_id:me.id,emoji:e});((rx[id]??={})[e]??=[]).push(me.id)}
 paintRx(id)}

 s.appendChild(row);

$("boomBtn").onclick=async()=>{
 const v=await modal({title:"> boom timer (seconds, 0 = off)",placeholder:"seconds",value:boomSecs||10});
 if(v===null)return;boomSecs=Math.max(0,parseInt(v)||0);$("boomBtn").style.background=boomSecs?"#ffb02066":"";
 toast(boomSecs?"boom timer set: "+boomSecs+"s":"boom timer off");
};
function handleCmd(raw){
 const [cmd,...rest]=raw.slice(1).split(" ");const arg=rest.join(" ").trim();
 if(cmd==="boom"){const n=arg==="off"?0:Math.max(0,parseInt(arg)||0);boomSecs=n;$("boomBtn").style.background=n?"#ffb02066":"";toast(n?"boom timer set: "+n+"s":"boom timer off");return}
 if(cmd==="theme")return setTheme(arg);
 if(cmd==="clear"){$("msgs").innerHTML="";lastDay="";toast("local view cleared");return}
 toast("unknown command: /"+cmd,"err");
}
async function send(){
 const body=$("txt").value.trim();if(!body||!room)return;$("txt").value="";
 if(!editing&&body.startsWith("/")){handleCmd(body);return}
 if(editing){const id=editing;editing=null;updBars();
  const {error}=await sb.from("messages").update({body,edited_at:new Date().toISOString()}).eq("id",id);
  if(error)toast(error.message,"err");return}
 const row={room_id:room,sender_id:me.id,body};
 if(replyTo)row.reply_to=replyTo;if(boomSecs)row.boom_seconds=boomSecs;
 replyTo=null;updBars();
 const {data,error}=await sb.from("messages").insert(row).select().single();
 if(error)toast("send failed: "+error.message,"err");else{msgs.set(data.id,data);draw(data)}
}
async function compressImage(file){
 const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)});
 const max=1280,sc=Math.min(1,max/Math.max(img.width,img.height));
 const cv=document.createElement("canvas");cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
 cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
 return new Promise(res=>cv.toBlob(b=>res(b),"image/jpeg",0.72));
}
async function sendMedia(file,type){
 if(!room)return;
 const tempId="tmp-"+crypto.randomUUID();
 const temp={id:tempId,sender_id:me.id,created_at:new Date().toISOString(),media_type:type,_local:type==="image"?URL.createObjectURL(file):null,_pending:true};
 msgs.set(tempId,temp);draw(temp);
 try{
  const blob=type==="image"?await compressImage(file):file;
  const ext=type==="image"?"jpg":(blob.type&&blob.type.includes("mp4")?"m4a":blob.type&&blob.type.includes("aac")?"aac":"webm");
  const path=room+"/"+crypto.randomUUID()+"."+ext;
  const {error:upErr}=await sb.storage.from("media").upload(path,blob,{contentType:type==="image"?"image/jpeg":(blob.type||"audio/webm")});
  if(upErr)throw upErr;
  const row={room_id:room,sender_id:me.id,media_path:path,media_type:type};
  if(boomSecs)row.boom_seconds=boomSecs;
  const {data,error}=await sb.from("messages").insert(row).select().single();
  if(error)throw error;
  msgs.delete(tempId);$("m-"+tempId)?.remove();
  msgs.set(data.id,data);draw(data);
 }catch(err){
  msgs.delete(tempId);$("m-"+tempId)?.remove();
  toast((type==="image"?"photo":"voice")+" send failed: "+(err.message||err),"err");
 }
}

let micStream=null;
async function getMicStream(){
 const tries=[{audio:true},{audio:true,video:{width:16,height:16}},{audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}];
 let lastErr=null;
 for(const c of tries){
  try{
   const s=await navigator.mediaDevices.getUserMedia(c);
   s.getVideoTracks().forEach(t=>t.stop());
   return s;
  }catch(e){lastErr=e;await new Promise(r=>setTimeout(r,300))}
 }
 throw lastErr;
}
$("micBtn").onclick=async()=>{
 if(mediaRecorder&&mediaRecorder.state==="recording"){mediaRecorder.stop();return}
 try{
  micStream=await getMicStream();
  const mime=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg"].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||"";
  recChunks=[];mediaRecorder=mime?new MediaRecorder(micStream,{mimeType:mime}):new MediaRecorder(micStream);
  mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size)recChunks.push(e.data)};
  mediaRecorder.onstop=()=>{micStream.getTracks().forEach(t=>t.stop());$("micBtn").classList.remove("rec");
   const blob=new Blob(recChunks,{type:mediaRecorder.mimeType||"audio/webm"});
   if(blob.size>800)sendMedia(blob,"voice");else toast("recording too short","err")};
  mediaRecorder.start();$("micBtn").classList.add("rec");
 }catch(e){toast("mic unavailable on this device: "+e.message+" — try 📎 to attach a recording instead","err")}
};

async function adminCall(body){const {data,error}=await sb.functions.invoke("admin-users",{body});
 if(error){let msg=error.message;try{const j=await error.context.json();msg=j.error||msg}catch(e){}return{error:msg}}return data}
async function loadUsers(){
 const l=$("ulist");l.innerHTML="";l.appendChild(loaderRow());
 const r=await adminCall({action:"list"});l.innerHTML="";
 (r.users||[]).forEach(u=>{
  const d=document.createElement("div");d.className="item";
  d.innerHTML="<b class='glow'></b> <small></small><br><br><button class='b'></button> <button class='rn'>RENAME</button> <button class='p'>RESET PASS</button> <button class='del danger'>DELETE</button>";
  d.querySelector("b").textContent=u.callsign||u.username;
  d.querySelector("small").textContent="@"+u.username+" · "+u.role+(u.is_banned?" · BANNED":"");
  const bb=d.querySelector(".b");bb.textContent=u.is_banned?"UNBAN":"BAN";
  if(u.id===me.id){["b","rn","p","del"].forEach(c=>d.querySelector("."+c).style.display="none")}
  bb.onclick=()=>withBusy(bb,async()=>{await adminCall({action:"ban",id:u.id,banned:!u.is_banned});loadUsers()});
  d.querySelector(".rn").onclick=async()=>{const nu=await modal({title:"> new username (a-z, 0-9, _)",placeholder:"username",value:u.username});if(!nu)return;
   await withBusy(d.querySelector(".rn"),async()=>{const x=await adminCall({action:"rename",id:u.id,username:nu});if(x.error)toast(x.error,"err");else{toast("username updated");loadUsers()}})};
  d.querySelector(".p").onclick=async()=>{const pw=await modal({title:"> new password (min 6)",placeholder:"password"});if(!pw)return;
   await withBusy(d.querySelector(".p"),async()=>{const x=await adminCall({action:"password",id:u.id,password:pw});toast(x.error||"password updated",x.error?"err":undefined)})};
  d.querySelector(".del").onclick=async()=>{const ok=await modal({title:"> delete @"+u.username+"? this cannot be undone",okText:"DELETE"});if(!ok)return;
   await withBusy(d.querySelector(".del"),async()=>{const x=await adminCall({action:"delete",id:u.id});if(x.error)toast(x.error,"err");else{toast("operative removed");loadUsers()}})};
  l.appendChild(d)});
}
