<style>
:root{--bg:#0a0a0b;--panel:#131316;--panel2:#1a1a1e;--g:#00ff9c;--c:#00e5ff;--r:#ff2e63;--o:#ffb020;--tx:#d6d6d8;--dim:#6b6b70;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,*{-webkit-user-select:none;-webkit-touch-callout:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
input,textarea,[contenteditable="true"]{-webkit-user-select:text;-webkit-touch-callout:default;user-select:text}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:14px ui-monospace,Menlo,Consolas,monospace;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);background:radial-gradient(ellipse 120% 60% at 50% -10%,rgba(255,255,255,.035),transparent 60%),var(--bg)}
#msgs,.list{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#rain{position:fixed;inset:0;width:100%;height:100%;opacity:.1;z-index:0;filter:grayscale(55%)}
button,input{font:inherit;color:var(--tx);background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:7px;padding:10px 12px;transition:background .15s ease,border-color .15s ease,transform .12s ease}
button{cursor:pointer}
button:active{background:rgba(255,255,255,.08);transform:scale(.98)}
input{width:100%;outline:none;caret-color:var(--g)}
input:focus{border-color:var(--g);outline:1px solid var(--g);outline-offset:-1px}
.glow{color:var(--g)}
.cur:after{content:"█";animation:bl 1s steps(1) infinite;color:var(--g)}@keyframes bl{50%{opacity:0}}
/* login */
#login{position:relative;z-index:1;display:none;flex-direction:column;gap:10px;justify-content:center;height:100%;padding:26px;max-width:420px;margin:auto}
.gl{position:relative;font-size:30px;letter-spacing:6px;text-align:center;color:var(--tx);margin-bottom:6px;font-weight:600}
.gl:before,.gl:after{content:attr(data-t);position:absolute;left:0;right:0;top:0}
.gl:before{color:var(--r);clip-path:inset(0 0 55% 0);animation:g1 5s infinite steps(1);opacity:.8}
.gl:after{color:var(--c);clip-path:inset(55% 0 0 0);animation:g2 5s infinite steps(1);opacity:.8}
@keyframes g1{0%,97%,100%{transform:none;opacity:0}98%{transform:translate(-3px,1px);opacity:.8}99%{transform:translate(2px,-1px);opacity:.8}}
@keyframes g2{0%,96%,100%{transform:none;opacity:0}97%{transform:translate(3px,1px);opacity:.8}98.5%{transform:translate(-2px,-1px);opacity:.8}}
#boot{color:var(--dim);font-size:12px;min-height:54px}
#login label{font-size:11px;color:var(--dim);letter-spacing:1px}
#err{color:var(--r);font-size:13px;min-height:18px}
/* app */
#app{position:relative;z-index:1;display:none;height:100%;flex-direction:column}
header{display:flex;align-items:center;gap:6px;padding:10px;border-bottom:1px solid var(--line);background:var(--panel)}
header h2{margin:0;flex:1;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.5px}
.view{display:none;flex-direction:column;flex:1;min-height:0}.view.on{display:flex}
.list{flex:1;overflow:auto;padding:10px}
.item{padding:13px 14px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--panel);animation:opin .3s ease-out both}
.item small{color:var(--dim)}
@keyframes opin{from{opacity:0;transform:translateY(6px)}}
/* operatives */
.op{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--panel);animation:opin .32s ease-out both}
.op.sel{border-color:var(--g);background:var(--panel2)}
.dot{width:8px;height:8px;border-radius:50%;background:#2e2e32;flex:none}
.dot.on{background:var(--g);box-shadow:0 0 6px var(--g);animation:pl 1.8s infinite}
@keyframes pl{50%{opacity:.45}}
.st{font-size:11px;color:var(--dim)}.st.on{color:var(--g)}
/* chat */
#msgs{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.m{max-width:84%;align-self:flex-start;padding:7px 10px;border:1px solid var(--line);border-left:2px solid var(--g);border-radius:9px 9px 9px 3px;background:var(--panel);word-break:break-word;animation:msgIn .36s ease-out}
@keyframes msgIn{0%{opacity:0;transform:translateY(6px);box-shadow:0 0 0 1px var(--g)}55%{opacity:1;transform:translateY(0);box-shadow:0 0 0 1px var(--g)}100%{box-shadow:0 0 0 0 transparent}}
.m.me{align-self:flex-end;border-left-color:var(--line);border-right:2px solid var(--r);border-radius:9px 9px 3px 9px;animation-name:msgInMe}
@keyframes msgInMe{0%{opacity:0;transform:translateY(6px);box-shadow:0 0 0 1px var(--r)}55%{opacity:1;transform:translateY(0);box-shadow:0 0 0 1px var(--r)}100%{box-shadow:0 0 0 0 transparent}}
.m .n{font-size:11px;color:var(--c);display:flex;align-items:center;gap:5px}.m.me .n{color:var(--r)}
.m .q{border-left:2px solid var(--c);padding:1px 6px;margin:3px 0;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .t{font-size:10px;color:var(--dim)}
.m.boom{border-color:var(--o);border-style:dashed}
.m.gone{opacity:.4;font-style:italic}
.rx{display:flex;gap:4px;flex-wrap:wrap}.rx span{border:1px solid var(--line);border-radius:10px;padding:1px 7px;margin-top:4px;font-size:12px}.rx .mine{background:rgba(0,255,156,.14);border-color:var(--g)}
#ctx{display:none;align-items:center;gap:8px;padding:6px 10px;border-top:1px solid var(--line);color:var(--c);font-size:12px;background:var(--panel)}
#ctx span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);background:var(--panel)}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);border-top:1px solid var(--line);border-radius:14px 14px 0 0;padding:12px;display:none;flex-direction:column;gap:8px;animation:up .22s cubic-bezier(.2,.8,.3,1);padding-bottom:calc(12px + env(safe-area-inset-bottom))}
@keyframes up{from{transform:translateY(100%)}}
#wrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}#msgs{min-height:0}
.av{display:inline-block;vertical-align:middle;border:1px solid;border-radius:8px;background:var(--bg);padding:2px;flex:none}
.row{display:flex;align-items:center;gap:12px}.mid{flex:1;min-width:0}
.rt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pv{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.unr .pv{color:var(--tx)}
.bdg{background:var(--g);color:#06120c;border-radius:10px;padding:0 7px;font-size:11px;font-weight:bold}
.unr{border-color:rgba(0,255,156,.35)}
.tm{color:var(--dim);font-size:11px}
.sep{align-self:center;color:var(--dim);font-size:10px;letter-spacing:2px;margin:6px 0}
.tk{font-size:10px;color:var(--dim)}.tk.seen{color:var(--c)}
#typing{display:none;padding:2px 12px;font-size:12px;color:var(--c)}#typing.on{display:block}
#typing.on:after{content:"...";display:inline-block;width:0;overflow:hidden;vertical-align:bottom;animation:dots 1.2s steps(4) infinite}
@keyframes dots{to{width:1.6em}}
#tobot{display:none;position:absolute;right:12px;bottom:10px;z-index:5;border-radius:20px;background:var(--panel2)}
#net{display:none;text-align:center;font-size:11px;padding:3px}
#net.bad{display:block;color:var(--o);background:rgba(255,176,32,.1)}

.modebar{display:flex;gap:8px;padding:10px}
.modebar button{flex:1;opacity:.5}.modebar button.active{opacity:1;border-color:var(--g);color:var(--g)}
#grpBar{display:none}
#micBtn.rec{background:rgba(255,46,99,.15);border-color:var(--r);color:var(--r);animation:pl 1s infinite}
.rec-bar{align-items:center}

.rec-timer small{color:var(--dim);font-family:inherit;letter-spacing:0;font-size:11px;margin-left:2px}
.rec-dot{width:9px;height:9px;border-radius:50%;background:var(--r);box-shadow:0 0 6px var(--r);flex:none;animation:pl 1s infinite}
.m img{max-width:220px;max-height:260px;border:1px solid var(--line);border-radius:6px;display:block;cursor:pointer}
.m audio{max-width:230px;height:34px}
.m .cap{margin-top:4px}
#toasts{position:fixed;top:calc(10px + env(safe-area-inset-top));left:0;right:0;z-index:70;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{pointer-events:auto;max-width:90%;padding:9px 14px;border:1px solid var(--g);background:var(--panel2);color:var(--g);font-size:13px;border-radius:8px;animation:tin .22s,tout .22s 2.6s forwards}
.toast.err{border-color:var(--r);color:var(--r)}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
#modalWrap{position:fixed;inset:0;z-index:71;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7)}
#modalWrap.on{display:flex}
#modalBox{width:min(320px,86vw);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;animation:up .2s cubic-bezier(.2,.8,.3,1)}
#modalBox .mt{color:var(--g);font-size:13px}
#modalBox .mb{display:flex;gap:8px;justify-content:flex-end}
.spin{width:13px;height:13px;border:2px solid rgba(255,255,255,.15);border-top-color:var(--g);border-radius:50%;display:inline-block;animation:spin .6s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.spin-ico{display:inline-block;animation:spin .8s linear infinite}
.pending .x img{opacity:.5}
.uploading{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:6px;margin-top:4px}
#titleWrap{flex:1;min-width:0;overflow:hidden}
#titleWrap h2{margin:0}
#substatus{display:block;color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#substatus.on{color:var(--g)}
.danger{border-color:var(--r) !important;color:var(--r) !important}
.icon-btn{width:36px;height:36px;min-width:36px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:16px;line-height:1;flex:none;background:transparent}
.icon-btn:active{transform:scale(.86)}
.bar .icon-btn{width:38px;height:38px;font-size:17px}
.loader{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--dim);letter-spacing:2px;font-size:12px;border-style:dashed}
.loader .pct{color:var(--g);min-width:34px;text-align:right}
/* drawer */
#drawerOverlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:54;opacity:0;pointer-events:none;transition:opacity .25s}
#drawerOverlay.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;left:0;top:0;bottom:0;width:min(80vw,300px);background:var(--panel);border-right:1px solid var(--line);z-index:55;display:flex;flex-direction:column;gap:10px;padding:16px 14px;padding-top:calc(16px + env(safe-area-inset-top));padding-bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-100%);transition:transform .28s cubic-bezier(.2,.8,.3,1);overflow:auto}
#drawer.open{transform:translateX(0)}
.dprof{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:2px}
.dprof .mid{min-width:0;overflow:hidden}
.dprof b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dsec{color:var(--dim);font-size:11px;letter-spacing:1px;margin-top:6px}
#drawer>button{width:100%;text-align:left}
#drawer .modebar{padding:0}
#drawer .modebar button{text-align:center}
#drawer #out{margin-top:auto}
.item.row{border:none;border-radius:0;background:transparent;margin-bottom:0;padding:11px 14px}
.item.row:active{background:rgba(255,255,255,.05)}
</style>

    const reveal=n<=1?p:(i/(n-1))*.72;
    if(p>=reveal+.1||p>=1)out+=ch;
    else out+=SCR[Math.random()*SCR.length|0];
   }
   el.textContent=out;
   if(p<1)requestAnimationFrame(frame);else{el.textContent=text;res()}
  }
  requestAnimationFrame(frame);
 });
}

/* turn raw technical errors into something a normal person can read */
function friendly(m){
 const raw=String((m&&m.message)||m||"");const s=raw.toLowerCase();
 try{console.warn("[rb]",raw);RBlog.add("app",raw)}catch(e){}
 const R=[
  [/failed to fetch|networkerror|network request|load failed|net::|err_internet|fetch failed|econnreset/,"no internet connection - check your network and try again"],
  [/invalid login|invalid credentials|wrong password|invalid_grant/,"wrong username or passkey"],
  [/jwt|refresh token|not authenticated|auth session missing/,"session expired - please log in again"],
  [/permission denied|row-level security|42501|forbidden|unauthori[sz]ed|not allowed|not authorized/,"you don't have permission to do that"],
  [/duplicate key|already exists|unique constraint|already registered|already taken/,"that already exists"],
  [/foreign key|violates/,"that item no longer exists"],
  [/does not exist|schema cache|could not find|pgrst|undefined column|function .* not found/,"this feature is not set up yet - please tell the admin"],
  [/timeout|timed out|aborterror/,"taking too long - please try again"],
  [/too large|payload|413|exceeds|file size/,"that file is too large"],
  [/rate limit|too many requests|429/,"too many tries - wait a moment and try again"],
  [/notallowederror|permission dismissed|microphone|getusermedia|audio source/,"microphone is not available - allow it in phone settings"],
  [/notfounderror|requested device not found/,"no microphone found on this device"]
 ];
 for(const [re,msg] of R)if(re.test(s))return msg;
 if(/[{}\[\]]|undefined|null|typeerror|referenceerror|syntaxerror|is not a function|cannot read|\bat \w+\.|[a-z]+_[a-z_]+|\b\d{5}\b/.test(raw)||raw.length>110)return "something went wrong - please try again";
 return raw;
}
function toast(msg,type){
 if(type==="err")msg=friendly(msg);
 const box=$("toasts"),key=(type||"")+"|"+msg;
 const ex=[...box.children].find(t=>t._k===key);
 if(ex){ /* same message again: just refresh it instead of stacking a copy */
  clearTimeout(ex._t);ex._t=setTimeout(()=>ex.remove(),2600);
  ex.classList.remove("bump");void ex.offsetWidth;ex.classList.add("bump");return;
 }
 while(box.children.length>=2)box.firstChild.remove(); /* never more than two on screen */
 const t=document.createElement("div");t.className="toast"+(type==="err"?" err":"");t._k=key;
 t.innerHTML=RBI.svg(type==="err"?"alert":"check")+"<span></span>";t.lastChild.textContent=msg;
 box.appendChild(t);t._t=setTimeout(()=>t.remove(),2600);
}

  try{
   const s=await navigator.mediaDevices.getUserMedia(c);
   s.getVideoTracks().forEach(t=>t.stop());
   return s;
  }catch(e){lastErr=e;await new Promise(r=>setTimeout(r,300))}
 }
 throw lastErr;
}
function b64ToBlob(b64,mime){
 if(typeof b64!=="string")b64="";
 if(b64.slice(0,5)==="data:"){const c=b64.indexOf(",");if(c!==-1)b64=b64.slice(c+1)}
 b64=b64.replace(/[\r\n\s]/g,"").replace(/-/g,"+").replace(/_/g,"/");
 while(b64.length%4)b64+="=";
 const bin=atob(b64),arr=new Uint8Array(bin.length);
 for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
 return new Blob([arr],{type:mime||"audio/aac"});
}
const VR=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.VoiceRecorder;
let recMode=null,recTimerInt=null,recStartTs=0;
function fmtRecTime(ms){const s=Math.max(0,Math.floor(ms/1000)),m=Math.floor(s/60),ss=s%60;return String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0")}
function showRecBar(){
 $("chatBar").style.display="none";$("recBar").style.display="flex";
 $("recTime").textContent="00:00";recStartTs=Date.now();
 clearInterval(recTimerInt);
 recTimerInt=setInterval(()=>{$("recTime").textContent=fmtRecTime(Date.now()-recStartTs)},250);
}
function hideRecBar(){
 clearInterval(recTimerInt);recTimerInt=null;
 $("recBar").style.display="none";$("chatBar").style.display="flex";
}
let micStarting=false;
async function startRec(){
 if(micRecording||micStarting)return;
 micStarting=true;
 try{
  if(VR){
   try{
    const {value:has}=await VR.hasAudioRecordingPermission();
    if(!has){
     const {value:granted}=await VR.requestAudioRecordingPermission();
     if(!granted){toast("microphone is off - allow it in phone settings, or hold the attach button to add a recording","err");return}
    }
    await VR.startRecording();
    micRecording=true;recMode="native";showRecBar();
   }catch(e){toast("could not start the microphone - try again, or hold the attach button to add a recording","err")}
   return;
  }
  try{
   micStream=await getMicStream();
   const mime=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg"].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||"";
   recChunks=[];mediaRecorder=mime?new MediaRecorder(micStream,{mimeType:mime}):new MediaRecorder(micStream);
   mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size)recChunks.push(e.data)};
   mediaRecorder.start();
   micRecording=true;recMode="web";showRecBar();
  }catch(e){toast("could not start the microphone - try again, or hold the attach button to add a recording","err")}
 }finally{micStarting=false}
}
async function finishRec(send){
 if(!micRecording)return;
 micRecording=false;hideRecBar();
 if(recMode==="native"){
  try{
   const res=await VR.stopRecording();
   if(!send)return;
   /* the plugin wraps its answer: {value:{recordDataBase64,msDuration,mimeType}} */
   const v=(res&&res.value&&typeof res.value==="object")?res.value:(res||{});
   const held=Date.now()-recStartTs;
   if(!v.recordDataBase64){toast(held<900?"hold the mic a little longer":"could not record - please try again","err");return}
   const blob=b64ToBlob(v.recordDataBase64,v.mimeType);
   if(blob.size>300)sendMedia(blob,"voice");else toast("hold the mic a little longer","err");
  }catch(e){if(send)toast("could not record - please try again","err")}
  return;
 }
 if(recMode==="web"){
  if(!mediaRecorder){return}
  const stopped=new Promise(res=>{mediaRecorder.onstop=res});
  try{mediaRecorder.stop()}catch(e){}
  await stopped;
  if(micStream)micStream.getTracks().forEach(t=>t.stop());
  if(!send)return;
  const blob=new Blob(recChunks,{type:mediaRecorder.mimeType||"audio/webm"});
  if(blob.size>300)sendMedia(blob,"voice");else toast("hold the mic a little longer","err");
 }
}
let micTouchHandled=false;
$("micBtn").addEventListener("touchstart",e=>{if(e.cancelable)e.preventDefault();micTouchHandled=true;startRec()},{passive:false});
$("micBtn").onclick=()=>{if(micTouchHandled){micTouchHandled=false;return}startRec()};
$("recDelete").onclick=()=>finishRec(false);
$("recSend").onclick=()=>finishRec(true);

async function adminCall(body){const {data,error}=await sb.functions.invoke("admin-users",{body});
 if(error){let msg=error.message;try{const j=await error.context.json();msg=j.error||msg}catch(e){}return{error:msg}}return data}
async function loadUsers(){
 const l=$("ulist");l.innerHTML="";l.appendChild(loaderRow());
 const r=await adminCall({action:"list"});clearLoaders(l);l.innerHTML="";
 if(r.error){toast(r.error,"err");return}
 if(!r.users||!r.users.length){l.innerHTML='<div class="item"><small>> no operatives found</small></div>';return}
 (r.users||[]).forEach(u=>{
  const d=document.createElement("div");d.className="item";
  d.innerHTML="<b class='glow'></b> <small></small><br><br><button class='b'></button> <button class='rn'>RENAME</button> <button class='p'>RESET PASS</button> <button class='del danger'>DELETE</button>";
  d.querySelector("b").textContent=u.callsign||u.username;
  d.querySelector("small").textContent="@"+u.username+" · "+u.role+(u.is_banned?" · BANNED":"");
  const bb=d.querySelector(".b");bb.textContent=u.is_banned?"UNBAN":"BAN";
  if(u.id===me.id){["b","rn","p","del"].forEach(c=>d.querySelector("."+c).style.display="none")}
  bb.onclick=()=>withBusy(bb,async()=>{const willBan=!u.is_banned;await adminCall({action:"ban",id:u.id,banned:willBan});
   sb.rpc("notify_user",{p_user_id:u.id,p_type:"admin_action",p_title:willBan?"account banned":"account unbanned",p_body:willBan?"your account was banned by an admin":"your account was unbanned — welcome back"}).then(()=>{});
   loadUsers()});
  d.querySelector(".rn").onclick=async()=>{const nu=await modal({title:"> new username (a-z, 0-9, _)",placeholder:"username",value:u.username});if(!nu)return;
   await withBusy(d.querySelector(".rn"),async()=>{const x=await adminCall({action:"rename",id:u.id,username:nu});if(x.error)toast(x.error,"err");else{toast("username updated");
    sb.rpc("notify_user",{p_user_id:u.id,p_type:"admin_action",p_title:"username changed",p_body:"your username was changed to @"+nu+" by an admin"}).then(()=>{});
    loadUsers()}})};
  d.querySelector(".p").onclick=async()=>{const pw=await modal({title:"> new password (min 6)",placeholder:"password"});if(!pw)return;
   await withBusy(d.querySelector(".p"),async()=>{const x=await adminCall({action:"password",id:u.id,password:pw});toast(x.error||"password updated",x.error?"err":undefined);
    if(!x.error)sb.rpc("notify_user",{p_user_id:u.id,p_type:"admin_action",p_title:"password changed",p_body:"your password was reset by an admin"}).then(()=>{})})};
  d.querySelector(".del").onclick=async()=>{const ok=await modal({title:"> delete @"+u.username+"? this cannot be undone",okText:"DELETE"});if(!ok)return;
   await withBusy(d.querySelector(".del"),async()=>{const x=await adminCall({action:"delete",id:u.id});if(x.error)toast(x.error,"err");else{toast("operative removed");loadUsers()}})};
  l.appendChild(d)});
}
