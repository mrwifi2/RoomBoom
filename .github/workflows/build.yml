name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: |
          mkdir -p www
          cp roomboom-ui.html www/index.html
          npx cap add android
          unzip -o icons.zip -d android/app/src/main/res
          sed -i '/<uses-permission android:name="android.permission.INTERNET" \/>/a\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' android/app/src/main/AndroidManifest.xml
          RES=android/app/src/main/res/values/styles.xml
          sed -i 's|<item name="android:background">@null</item>|<item name="android:background">@null</item><item name="android:statusBarColor">#020806</item><item name="android:navigationBarColor">#020806</item><item name="android:windowBackground">#020806</item>|' $RES
          sed -i 's|<item name="android:background">@drawable/splash</item>|<item name="android:background">#020806</item><item name="windowSplashScreenBackground">#020806</item>|' $RES
          MAINACT=android/app/src/main/java/com/roomboom/app/MainActivity.java
          cat > $MAINACT << 'JAVA'
          package com.roomboom.app;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import androidx.core.app.ActivityCompat;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebChromeClient;
          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              if (ActivityCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.RECORD_AUDIO}, 6541);
              }
              getBridge().getWebView().setWebChromeClient(new BridgeWebChromeClient(getBridge()) {
                @Override
                public void onPermissionRequest(final PermissionRequest request) {
                  runOnUiThread(() -> request.grant(request.getResources()));
                }
              });
            }
          }
          JAVA
          npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: roomboom-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
