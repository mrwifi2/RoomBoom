<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RoomBoom</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#05070f;--panel:#0b1020;--cy:#00f0ff;--mg:#ff2bd6;--tx:#d6e8ff;--dim:#6b7fa3}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:ui-monospace,Menlo,Consolas,monospace}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
button,input{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--cy);border-radius:6px;padding:10px}
button{cursor:pointer;box-shadow:0 0 8px #00f0ff44}button:active{background:#00f0ff22}
input{width:100%;outline:none}input:focus{box-shadow:0 0 10px var(--cy)}
.glow{color:var(--cy);text-shadow:0 0 12px var(--cy);letter-spacing:4px}
.glitch{animation:gl 3s infinite}@keyframes gl{0%,92%,100%{transform:none}94%{transform:translate(2px,-1px);color:var(--mg)}96%{transform:translate(-2px,1px)}}
#login{display:flex;flex-direction:column;gap:12px;justify-content:center;height:100%;padding:28px;max-width:420px;margin:auto}
#boot{color:var(--dim);font-size:12px;min-height:34px}
#app{display:none;height:100%;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px solid #00f0ff55}
header h2{margin:0;flex:1;font-size:16px}
.list{flex:1;overflow:auto;padding:8px}
.item{padding:14px;border:1px solid #00f0ff33;border-radius:8px;margin-bottom:8px;background:var(--panel)}
.item small{color:var(--dim)}
#msgs{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.m{max-width:80%;padding:8px 10px;border-radius:10px;background:var(--panel);border:1px solid #00f0ff33;word-break:break-word}
.m.me{align-self:flex-end;border-color:var(--mg);box-shadow:0 0 8px #ff2bd633}
.m b{display:block;font-size:11px;color:var(--cy)}.m .t{font-size:10px;color:var(--dim)}
.m.boom{border-style:dashed;border-color:#ff9c2b}
.bar{display:flex;gap:6px;padding:8px;border-top:1px solid #00f0ff55}
.view{display:none;flex-direction:column;flex:1;min-height:0}.view.on{display:flex}
#err{color:#ff5c7a;font-size:13px;min-height:18px}
</style>
</head>
<body>

<div id="login">
  <h1 class="glow glitch" style="text-align:center;margin:0">ROOMBOOM</h1>
  <div id="boot"></div>
  <input id="uid" placeholder="username / email" autocapitalize="none" autocomplete="username">
  <input id="pw" type="password" placeholder="passcode" autocomplete="current-password">
  <button id="go">ESTABLISH LINK</button>
  <div id="err"></div>
</div>

<div id="app">
  <header>
    <button id="back" style="display:none">◀</button>
    <h2 class="glow" id="title">ROOMBOOM</h2>
    <button id="plus">＋</button>
    <button id="adm" style="display:none">⚙</button>
    <button id="out">⏻</button>
  </header>

  <div class="view on" id="v-rooms"><div class="list" id="rooms"></div></div>
  <div class="view" id="v-users"><div class="list" id="users"></div></div>

  <div class="view" id="v-chat">
    <div id="msgs"></div>
    <div class="bar">
      <button id="boomBtn" title="Boom timer">💣</button>
      <input id="txt" placeholder="transmit..." autocomplete="off">
      <button id="send">➤</button>
    </div>
  </div>

  <div class="view" id="v-admin">
    <div class="list">
      <div class="item">
        <b class="glow">NEW OPERATIVE</b><br><br>
        <input id="nu" placeholder="username (a-z, 0-9, _)" autocapitalize="none"><br><br>
        <input id="nc" placeholder="callsign (display name)"><br><br>
        <input id="np" placeholder="password (min 6)"><br><br>
        <button id="mk">CREATE USER</button>
        <div id="aerr" style="margin-top:8px;font-size:13px"></div>
      </div>
      <div id="ulist"></div>
    </div>
  </div>
</div>

<script>
const SB_URL="https://qgvpsqxcnwcbvieodnna.supabase.co";
const SB_KEY="sb_publishable_n_do5KpNG1NH4uWiMf9kIQ_fWu6tO-N";
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
let me=null,profiles={},room=null,chan=null,boomSecs=0,view="rooms";

// ---- boot text ----
(function(){const t="> initializing secure uplink...";let i=0;const e=$("boot");
const iv=setInterval(()=>{e.textContent=t.slice(0,++i);if(i>=t.length)clearInterval(iv)},35)})();

// ---- auth ----
$("go").onclick=async()=>{
  $("err").textContent="";
  let id=$("uid").value.trim().toLowerCase();
  if(!id.includes("@"))id+="@roomboom.app";
  const {error}=await sb.auth.signInWithPassword({email:id,password:$("pw").value});
  if(error)$("err").textContent="ACCESS DENIED ("+error.message+")";else start();
};
$("out").onclick=async()=>{await sb.auth.signOut();location.reload()};

async function start(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return;
  const {data:ps}=await sb.from("profiles").select("*");
  ps.forEach(p=>profiles[p.id]=p);
  me=profiles[session.user.id];
  if(!me||me.is_banned){await sb.auth.signOut();$("err").textContent="ACCOUNT LOCKED";return}
  $("login").style.display="none";$("app").style.display="flex";
  if(me.role==="admin")$("adm").style.display="";
  show("rooms");loadRooms();
}

// ---- views ----
function show(v){
  view=v;
  ["rooms","users","chat","admin"].forEach(x=>$("v-"+x).classList.toggle("on",x===v));
  $("back").style.display=v==="rooms"?"none":"";
  $("plus").style.display=v==="rooms"?"":"none";
  $("adm").style.display=(v==="rooms"&&me.role==="admin")?"":"none";
  if(v==="rooms")$("title").textContent="ROOMBOOM";
  if(v!=="chat"&&chan){sb.removeChannel(chan);chan=null;room=null}
}
$("back").onclick=()=>{show("rooms");loadRooms()};
$("plus").onclick=()=>{show("users");$("title").textContent="NEW COMMS";
  const l=$("users");l.innerHTML="";
  Object.values(profiles).filter(p=>p.id!==me.id&&!p.is_banned).forEach(p=>{
    const d=document.createElement("div");d.className="item";d.textContent="◉ "+(p.callsign||p.username);
    d.onclick=async()=>{const {data,error}=await sb.rpc("create_dm",{other:p.id});
      if(!error)openRoom(data,p.callsign||p.username)};
    l.appendChild(d)})};
$("adm").onclick=()=>{show("admin");$("title").textContent="COMMAND";loadUsers()};

// ---- rooms ----
async function loadRooms(){
  const {data:ms}=await sb.from("room_members").select("room_id,user_id,rooms(id,type,name)");
  const l=$("rooms");l.innerHTML="";
  const byRoom={};(ms||[]).forEach(m=>{(byRoom[m.room_id]??=[]).push(m)});
  Object.values(byRoom).forEach(arr=>{
    const r=arr[0].rooms;
    const other=arr.find(m=>m.user_id!==me.id);
    const name=r.type==="dm"?(profiles[other?.user_id]?.callsign||"?"):(r.name||"room");
    const d=document.createElement("div");d.className="item";
    d.innerHTML="<b></b><br><small></small>";
    d.querySelector("b").textContent=(r.type==="dm"?"◉ ":"# ")+name;
    d.querySelector("small").textContent=r.type;
    d.onclick=()=>openRoom(r.id,name);l.appendChild(d)});
  if(!l.children.length)l.innerHTML='<div class="item"><small>no active links. tap ＋ to start.</small></div>';
}

// ---- chat ----
async function openRoom(id,name){
  room=id;show("chat");$("title").textContent=name;$("msgs").innerHTML="";
  const {data}=await sb.from("messages").select("*").eq("room_id",id).order("created_at",{ascending:false}).limit(60);
  (data||[]).reverse().forEach(addMsg);
  chan=sb.channel("room-"+id).on("postgres_changes",
    {event:"INSERT",schema:"public",table:"messages",filter:"room_id=eq."+id},
    p=>addMsg(p.new)).subscribe();
}
function addMsg(m){
  if(m.deleted_at)return;
  const left=m.expires_at?new Date(m.expires_at)-Date.now():null;
  if(left!==null&&left<=0)return;
  const d=document.createElement("div");
  d.className="m"+(m.sender_id===me.id?" me":"")+(m.expires_at?" boom":"");
  const sender=profiles[m.sender_id]?.callsign||"?";
  d.innerHTML="<b></b><span class='x'></span> <span class='t'></span>";
  d.querySelector("b").textContent=sender;
  d.querySelector(".x").textContent=m.body||"";
  d.querySelector(".t").textContent=new Date(m.created_at).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+(m.expires_at?" 💣":"");
  $("msgs").appendChild(d);$("msgs").scrollTop=1e9;
  if(left!==null)setTimeout(()=>{d.style.transition="all .4s";d.style.transform="scale(1.3)";d.style.opacity="0";
    setTimeout(()=>d.remove(),400)},left);
}
$("boomBtn").onclick=()=>{
  const v=prompt("Boom timer in seconds (0 = off)",boomSecs||10);
  if(v===null)return;boomSecs=Math.max(0,parseInt(v)||0);
  $("boomBtn").style.background=boomSecs?"#ff9c2b55":"";
};
async function send(){
  const body=$("txt").value.trim();if(!body||!room)return;
  $("txt").value="";
  const row={room_id:room,sender_id:me.id,body};
  if(boomSecs)row.boom_seconds=boomSecs;
  const {error}=await sb.from("messages").insert(row);
  if(error)alert("send failed: "+error.message);
}
$("send").onclick=send;$("txt").onkeydown=e=>{if(e.key==="Enter")send()};

// ---- admin ----
async function adminCall(body){
  const {data,error}=await sb.functions.invoke("admin-users",{body});
  return error?{error:error.message}:data;
}
async function loadUsers(){
  const r=await adminCall({action:"list"});const l=$("ulist");l.innerHTML="";
  (r.users||[]).forEach(u=>{
    const d=document.createElement("div");d.className="item";
    d.innerHTML="<b></b> <small></small><br><br><button class='b'></button> <button class='p'>RESET PASS</button>";
    d.querySelector("b").textContent=u.callsign||u.username;
    d.querySelector("small").textContent="@"+u.username+" · "+u.role+(u.is_banned?" · BANNED":"");
    const bb=d.querySelector(".b");bb.textContent=u.is_banned?"UNBAN":"BAN";
    if(u.id===me.id){bb.style.display="none";d.querySelector(".p").style.display="none"}
    bb.onclick=async()=>{await adminCall({action:"ban",id:u.id,banned:!u.is_banned});loadUsers()};
    d.querySelector(".p").onclick=async()=>{const pw=prompt("New password (min 6)");
      if(!pw)return;const x=await adminCall({action:"password",id:u.id,password:pw});
      alert(x.error||"password updated")};
    l.appendChild(d)});
}
$("mk").onclick=async()=>{
  const r=await adminCall({action:"create",username:$("nu").value,callsign:$("nc").value,password:$("np").value});
  $("aerr").style.color=r.error?"#ff5c7a":"#5cff9c";
  $("aerr").textContent=r.error||"operative created";
  if(!r.error){$("nu").value=$("nc").value=$("np").value="";loadUsers()}
};

sb.auth.getSession().then(({data})=>{if(data.session)start()});
</script>
</body>
</html>
