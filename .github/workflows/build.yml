name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: |
          mkdir -p www assets
          cp roomboom-ui.html www/index.html
          cp icon-only.png assets/icon-only.png
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#020806' --iconBackgroundColorDark '#020806' || echo "icon step skipped"
          npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: roomboom-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
