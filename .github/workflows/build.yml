name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --legacy-peer-deps
      - run: |
          set -x
          mkdir -p www
          cp roomboom-ui.html www/index.html
          cp nav.css ui.css chat.css home.css panels.css boom.css player.css picker.css display.css www/
          for f in nav icons offline gestures chat home boom player picker display termguide panels; do
            if [ -f "$f.js.txt" ]; then cp "$f.js.txt" "www/$f.js"; elif [ -f "$f.js" ]; then cp "$f.js" "www/$f.js"; else echo "missing $f.js"; exit 1; fi
          done
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/supabase.js || echo "local supabase copy skipped (CDN fallback will be used)"
          npx cap add android
          unzip -o icons.zip -d android/app/src/main/res
          sed -i '/<uses-permission android:name="android.permission.INTERNET" \/>/a\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' android/app/src/main/AndroidManifest.xml
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' '<color name="rb_bg">#0a0a0b</color>' '</resources>' > android/app/src/main/res/values/rb_colors.xml
          python3 -c '
          import re
          p = "android/app/src/main/res/values/styles.xml"
          s = open(p).read()
          def setbg(s, name, items):
              pat = re.compile("(<style name=\"" + re.escape(name) + "\"[^>]*>)(.*?)(</style>)", re.S)
              def repl(m):
                  body = m.group(2)
                  for k in items:
                      body = re.sub("<item name=\"" + re.escape(k) + "\">.*?</item>", "", body)
                  add = "".join("<item name=\"" + k + "\">" + v + "</item>" for k, v in items.items())
                  return m.group(1) + body + add + m.group(3)
              return pat.sub(repl, s)
          s = setbg(s, "AppTheme.NoActionBarLaunch", {"android:windowBackground": "@color/rb_bg"})
          s = setbg(s, "AppTheme", {"android:windowBackground": "@color/rb_bg", "android:statusBarColor": "@color/rb_bg", "android:navigationBarColor": "@color/rb_bg"})
          open(p, "w").write(s)
          ' || echo "theme patch skipped, continuing"
          MAINACT=android/app/src/main/java/com/roomboom/app/MainActivity.java
          cp MainActivity.java.txt "$MAINACT"
          cp RBMediaPlugin.java.txt android/app/src/main/java/com/roomboom/app/RBMediaPlugin.java
          sed -i '/<uses-permission android:name="android.permission.INTERNET" \/>/a\    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" \/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" \/>' android/app/src/main/AndroidManifest.xml
          unzip -o terminal-src.zip -d terminal-src
          mkdir -p android/app/src/main/java/com/myterminal/app
          cp terminal-src/src/com/myterminal/app/*.java android/app/src/main/java/com/myterminal/app/
          cp RBTermPlugin.java.txt android/app/src/main/java/com/roomboom/app/RBTermPlugin.java
          python3 terminal-src/inject.py
          bash terminal-src/fetch-assets.sh android/app/src/main
          npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: roomboom-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
